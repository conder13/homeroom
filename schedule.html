<!DOCTYPE html>

<head>
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css" />
   <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
   <script type="module" src="schedule.js" defer></script>
   <link rel="icon" type="image/x-icon" href="hrlogo7.png">
   <title>Schedule - Homeroom</title>
</head>

<body>
<div class="navbar">
   <img src="hrlogo7.png" id="navlogo"></img>
   <a id="navlink" href="index.html">
      <h2 id="navlink">Home</h2>
   </a>
   <a id="navlink_clicked" href="schedule.html">
      <h2 id="navlink_clicked">Schedule</h2>
   </a>
</div>

<div class="banner">
   <h1 id="welcome">Schedule</h1>
</div>

<div id="app">
   <div id="classPanel">
      <h2>Classes</h2>
      <div id="classInput">
         <input type="text" id="newClassName" minlength="1" maxlength="12" placeholder="Add class..." />
         <button id="addClassBtn" type="button">+</button>
      </div>
      <div id="classListContainer">
         <div id="classList"></div>
      </div>
   </div>

   <p id="dragHint">Drag a class onto a day below. Drag a placed class to another slot to move it.</p>

   <div id="uploadPanel">
      <label for="scheduleUpload" id="uploadLabel">Upload schedule PDF</label>
      <input type="file" id="scheduleUpload" accept="application/pdf" />
      <span id="uploadStatus"></span>
   </div>

   <div id="scheduleHeader">
      <h2>Your Schedule</h2>
      <button id="clearSchedule" type="button">Clear Schedule</button>
   </div>
   <div id="scheduleContainer"></div>
</div>

</body>

</html>
